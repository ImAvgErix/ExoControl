name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[ocr]"
          pip install pytest
      - name: Unit tests
        run: python -m pytest tests -q --tb=line
      - name: Doctor
        run: exo-control doctor
      - name: CDP accept (skip-ok without ambient browser CDP)
        run: python scripts/accept_cdp_live.py
        env:
          EXO_ACCEPT_REQUIRE_CDP: "0"
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: CDP accept with launched Chromium (required)
        run: python scripts/accept_cdp_chromium.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist/wheel
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Twine check
        run: |
          pip install twine
          twine check dist/*
