[project]
name = "exo-control"
version = "2.2.0"
description = "Exo Control — realtime PC eyes and hands for any AI agent (MCP + CLI + Python). Compact. Leased. Honest."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ImAvgErix" }]
keywords = ["ai", "agent", "mcp", "uia", "desktop", "automation", "computer-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mss>=9.0.0",
    "pynput>=1.7.6",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "mcp>=1.0.0",
    "pywinauto>=0.6.8; platform_system=='Windows'",
]

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
ocr = ["pytesseract", "easyocr"]
agent = ["openai"]
legacy-input = ["pyautogui>=0.9.54"]
dev = ["pytest>=7.0", "build", "twine"]
full = ["playwright>=1.40.0", "pytesseract", "easyocr", "pyautogui>=0.9.54"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
exo-control = "exo_control.cli:main"
aether = "exo_control.cli:main"

[project.urls]
Homepage = "https://github.com/ImAvgErix/ExoControl"
Repository = "https://github.com/ImAvgErix/ExoControl"
Issues = "https://github.com/ImAvgErix/ExoControl/issues"
Documentation = "https://github.com/ImAvgErix/ExoControl#readme"



