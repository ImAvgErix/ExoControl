[project]
name = "exo-control"
version = "1.0.0"
description = "Exo Control — realtime PC eyes and hands for any AI agent. Compact. Leased. Honest. Jarvis OS complete."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mss>=9.0.0",
    "pynput>=1.7.6",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "mcp>=1.0.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
ocr = ["pytesseract", "easyocr"]
agent = ["openai"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[project.scripts]
aether = "aether.cli:main"

exo-control = "aether.cli:main"
[project.urls]
Homepage = "https://github.com/ImAvgErix/ExoControl"
Repository = "https://github.com/ImAvgErix/ExoControl"



